server:
  port: 8082

spring:
  application:
    name: rider-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/app_db}?currentSchema=rider_schema
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO
